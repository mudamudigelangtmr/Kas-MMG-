<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kas MMG</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #166534;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      opacity: 0.9;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h3 {
      margin: 0 0 10px;
      color: #666;
      font-size: 14px;
    }

    .card strong {
      font-size: 22px;
      color: #166534;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px 8px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th {
      background: #f0fdf4;
      color: #166534;
    }

    .lunas {
      color: #15803d;
      font-weight: bold;
    }

    .belum {
      color: #dc2626;
      font-weight: bold;
    }

    button {
      border: none;
      padding: 8px 12px;
      border-radius: 7px;
      cursor: pointer;
      background: #166534;
      color: white;
    }

    button:hover {
      opacity: 0.85;
    }

    .loading {
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 700px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .filters {
        flex-direction: column;
      }

      table {
        font-size: 14px;
      }

      th, td {
        padding: 9px 5px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Kas MMG</h1>
  <p>Manajemen Kas Muda-Mudi Gelang</p>
</header>

<div class="container">

  <div class="cards">

    <div class="card">
      <h3>Jumlah Anggota</h3>
      <strong id="jumlahAnggota">0 Orang</strong>
    </div>

    <div class="card">
      <h3>Sudah Bayar</h3>
      <strong id="sudahBayar">0 Orang</strong>
    </div>

    <div class="card">
      <h3>Total Kas</h3>
      <strong id="totalKas">Rp0</strong>
    </div>

  </div>

  <div class="box">

    <h2>Iuran Agustus 2026</h2>

    <div class="filters">
      <input
        type="text"
        id="search"
        placeholder="Cari nama anggota..."
        oninput="tampilkanData()"
      >

      <select id="filterRT" onchange="tampilkanData()">
        <option value="">Semua RT</option>
        <option value="RT 08">RT 08</option>
        <option value="RT 09">RT 09</option>
        <option value="RT 10">RT 10</option>
        <option value="RT 11">RT 11</option>
      </select>
    </div>

    <div id="loading" class="loading">
      Memuat data anggota...
    </div>

    <table id="tabel" style="display:none;">
      <thead>
        <tr>
          <th>No</th>
          <th>Nama</th>
          <th>RT</th>
          <th>Status</th>
          <th>Aksi</th>
        </tr>
      </thead>

      <tbody id="daftarAnggota"></tbody>
    </table>

  </div>

</div>

<script>

const SUPABASE_URL =
  "https://iuebrtptddbwgfajrmrb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_2mXlRe4EDRedMVvvbsF2zg_7hFYBNb6";

let dataAnggota = [];


async function ambilData() {

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/anggota?select=id,rt,nama&order=rt,nama",
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        }
      }
    );

    if (!response.ok) {
  const errorText = await response.text();
  throw new Error(
    "Supabase anggota: " + response.status + " - " + errorText
  );
  }

    const anggota = await response.json();


    const responseIuran = await fetch(
      SUPABASE_URL +
      "/rest/v1/iuran?select=id,anggota_id,bulan,tahun,jumlah,status&bulan=eq.Agustus&tahun=eq.2026",
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        }
      }
    );

    if (!responseIuran.ok) {
      throw new Error("Gagal mengambil data iuran");
    }

    const iuran = await responseIuran.json();


    dataAnggota = anggota.map(orang => {

      const pembayaran = iuran.find(
        item => item.anggota_id === orang.id
      );

      return {
        ...orang,
        iuran_id: pembayaran ? pembayaran.id : null,
        jumlah: pembayaran ? pembayaran.jumlah : 8000,
        status: pembayaran ? pembayaran.status : false
      };

    });


    document.getElementById("loading").style.display = "none";
    document.getElementById("tabel").style.display = "table";

    tampilkanData();

  } catch (error) {

    document.getElementById("loading").innerHTML =
      "Gagal memuat data: " + error.message;

  }

}


function tampilkanData() {

  const search =
    document.getElementById("search")
    .value
    .toLowerCase();

  const filterRT =
    document.getElementById("filterRT")
    .value;

  const hasil = dataAnggota.filter(orang => {

    const cocokNama =
      orang.nama.toLowerCase().includes(search);

    const cocokRT =
      filterRT === "" ||
      orang.rt === filterRT;

    return cocokNama && cocokRT;

  });


  const tbody =
    document.getElementById("daftarAnggota");

  tbody.innerHTML = "";


  hasil.forEach((orang, index) => {

    const tr = document.createElement("tr");

    tr.innerHTML = `

      <td>${index + 1}</td>

      <td>${orang.nama}</td>

      <td>${orang.rt}</td>

      <td class="${orang.status ? "lunas" : "belum"}">
        ${orang.status ? "Lunas" : "Belum Bayar"}
      </td>

      <td>
        <button onclick="ubahStatus(${orang.iuran_id}, ${orang.status})">
          ${orang.status ? "Batalkan" : "Bayar"}
        </button>
      </td>

    `;

    tbody.appendChild(tr);

  });


  updateStatistik();

}


function updateStatistik() {

  const jumlah =
    dataAnggota.length;

  const sudah =
    dataAnggota.filter(
      orang => orang.status
    ).length;

  const total =
    dataAnggota
      .filter(orang => orang.status)
      .reduce(
        (sum, orang) => sum + orang.jumlah,
        0
      );


  document.getElementById("jumlahAnggota")
    .textContent = jumlah + " Orang";

  document.getElementById("sudahBayar")
    .textContent = sudah + " Orang";

  document.getElementById("totalKas")
    .textContent =
      "Rp" + total.toLocaleString("id-ID");

}


async function ubahStatus(id, statusSekarang) {

  if (!id) {
    alert("Data iuran tidak ditemukan.");
    return;
  }


  const statusBaru =
    !statusSekarang;


  const response = await fetch(
    SUPABASE_URL +
    "/rest/v1/iuran?id=eq." + id,
    {
      method: "PATCH",

      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },

      body: JSON.stringify({
        status: statusBaru
      })

    }
  );


  if (!response.ok) {

    alert("Gagal mengubah status pembayaran.");

    return;
  }


  const orang =
    dataAnggota.find(
      item => item.iuran_id === id
    );

  if (orang) {
    orang.status = statusBaru;
  }


  tampilkanData();

}


ambilData();

</script>

</body>
</html>
