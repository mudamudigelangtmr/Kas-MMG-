<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kas MMG</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #166534;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      opacity: 0.9;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h3 {
      margin: 0 0 10px;
      color: #666;
      font-size: 14px;
    }

    .card strong {
      font-size: 22px;
      color: #166534;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .box h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px 8px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th {
      background: #f0fdf4;
      color: #166534;
    }

    .lunas {
      color: #15803d;
      font-weight: bold;
    }

    .belum {
      color: #dc2626;
      font-weight: bold;
    }

    @media (max-width: 700px) {
      .cards {
        grid-template-columns: 1fr;
      }

      table {
        font-size: 14px;
      }

      th:nth-child(1),
      td:nth-child(1) {
        display: none;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Kas MMG</h1>
  <p>Manajemen Kas Muda-Mudi Gelang</p>
</header>

<div class="container">

  <div class="cards">

    <div class="card">
      <h3>Jumlah Anggota</h3>
      <strong>86 Orang</strong>
    </div>

    <div class="card">
      <h3>Iuran Per Bulan</h3>
      <strong>Rp8.000</strong>
    </div>

    <div class="card">
      <h3>Target Iuran</h3>
      <strong>Rp688.000</strong>
    </div>

  </div>

  <div class="box">

    <h2>Daftar Anggota</h2>

    <input
      type="text"
      id="search"
      placeholder="Cari nama anggota..."
      onkeyup="cariAnggota()"
    >

    <table>
      <thead>
        <tr>
          <th>No</th>
          <th>Nama</th>
          <th>RT</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody id="daftarAnggota">

        <tr>
          <td>1</td>
          <td>Supri</td>
          <td>08</td>
          <td class="belum">Belum Bayar</td>
        </tr>

        <tr>
          <td>2</td>
          <td>Edwar</td>
          <td>08</td>
          <td class="belum">Belum Bayar</td>
        </tr>

        <tr>
          <td>3</td>
          <td>Heti</td>
          <td>08</td>
          <td class="belum">Belum Bayar</td>
        </tr>

        <tr>
          <td>4</td>
          <td>Rizal</td>
          <td>08</td>
          <td class="belum">Belum Bayar</td>
        </tr>

      </tbody>
    </table>

  </div>

</div>

<script>

function cariAnggota() {

  let input = document
    .getElementById("search")
    .value
    .toLowerCase();

  let rows = document
    .getElementById("daftarAnggota")
    .getElementsByTagName("tr");

  for (let i = 0; i < rows.length; i++) {

    let nama = rows[i]
      .getElementsByTagName("td")[1];

    if (nama) {

      let teks = nama.textContent.toLowerCase();

      rows[i].style.display =
        teks.includes(input) ? "" : "none";

    }
  }
}

</script>

</body>
  </html>
